<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Dubber</title>
<style>
:root{--bg:#f1f3f8;--card:#fff;--ink:#141b2d;--mut:#5d6882;--line:#d9deea;--acc:#3a3fd8;--ok:#0f8a6a}
@media(prefers-color-scheme:dark){:root{--bg:#10131d;--card:#181c2a;--ink:#e9ecf5;--mut:#98a2bd;--line:#2a3045;--acc:#8b90ff;--ok:#3fd0a6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI","Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:28px 16px 60px}h1{margin:0;font-size:1.9rem;letter-spacing:-.02em}
.s{color:var(--mut);margin:4px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
#drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--mut)}
#drop:hover,#drop:focus-within{border-color:var(--acc)}#drop b{color:var(--ink)}
input[type=text],select{width:100%;font:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}@media(max-width:560px){.row{grid-template-columns:1fr}}
label.l{display:block;font-weight:600;margin-bottom:6px}.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
.seg input{position:absolute;opacity:0}.seg input:checked+span{color:var(--acc);font-weight:700}
.seg label:has(input:checked){border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.seg label:has(input:focus-visible){outline:3px solid var(--acc)}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){button{color:#10131d}}button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
#err{color:#d33;font-weight:600}.hide{display:none}video{width:100%;border-radius:12px;background:#000}
.dl{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:9px;background:var(--ok);color:#fff;text-decoration:none;font-weight:700}
#tr{max-height:280px;overflow:auto;margin-top:14px;border-top:1px solid var(--line)}#tr p{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}#tr small{display:block;color:var(--mut)}
</style></head><body><main>
<h1>AI Video Dubber</h1><p class="s">Video do, language chuno. Awaaz ban jayegi Hindi ya English mein, wahi video dubbed hoke milega.</p>
<section class="card" id="form">
<label id="drop" for="f"><b id="fn">Video yahan drop karo ya click karke chuno</b><br><small>mp4, mkv, mov, webm <span id="lim"></span></small></label>
<input type="file" id="f" accept="video/*" class="hide">
<div style="margin-top:14px"><label class="l" for="url">Ya video ka link (optional)</label><input type="text" id="url" placeholder="https://..."></div>
<div class="row"><div><span class="l" style="display:block;font-weight:600;margin-bottom:6px">Kis language mein dub karna hai?</span>
<div class="seg"><label><input type="radio" name="lang" value="hi" checked><span>हिन्दी</span></label><label><input type="radio" name="lang" value="en"><span>English</span></label></div></div>
<div><label class="l" for="voice">Awaaz</label><select id="voice"><option value="female">Female</option><option value="male">Male</option></select></div></div>
<label style="display:flex;gap:8px;margin-top:14px;align-items:center"><input type="checkbox" id="keep"> Original awaaz / music halki rakho</label>
<button id="go">Dub karo</button></section>
<section class="card hide" id="run"><b id="stage"></b><div class="bar"><i id="b"></i></div><small id="pct" style="color:var(--mut)"></small><div id="err"></div></section>
<section class="card hide" id="res"><video id="v" controls playsinline class="hide"></video><audio id="au" controls class="hide" style="width:100%"></audio>
<a class="dl hide" id="a" href="#">Download dubbed video</a> <a class="dl" id="a2" href="#">Download dubbed audio</a> <a class="dl" id="a3" href="#">Subtitles (.srt)</a>
<p id="note" style="color:var(--mut)"></p><div id="tr" aria-label="Translated transcript"></div></section>
</main><script>
var $=function(i){return document.getElementById(i)},file=null,tm,LIM=0,CH=8388608,LS=window.localStorage;
function ls(k,v){try{if(v===undefined)return JSON.parse(LS.getItem(k)||'null');if(v===null)LS.removeItem(k);else LS.setItem(k,JSON.stringify(v))}catch(e){return null}}
async function F(u,o){var r=await fetch(u,o);
  if(r.status===401){var c=prompt('Access code daalo:');if(c===null)return r;var f=new FormData();f.append('code',c);
    var l=await fetch('/api/login',{method:'POST',body:f});if(l.ok)return fetch(u,o)}
  return r}
fetch('/api/config').then(function(r){return r.json()}).then(function(c){LIM=c.max_mb;$('lim').textContent='(max '+c.max_mb+' MB, '+c.max_min+' min)'}).catch(function(){});
function bar(s,p){$('stage').textContent=s;$('b').style.width=p+'%';$('pct').textContent=p+'%'}
function fail(m){clearInterval(tm);$('run').classList.remove('hide');$('err').textContent=m;$('go').disabled=false}
function pick(f){if(!f)return;if(LIM&&f.size>LIM*1048576){file=null;return fail('Video '+(f.size/1048576).toFixed(0)+' MB ka hai, limit '+LIM+' MB.')}
  $('err').textContent='';file=f;$('fn').textContent=f.name+' ('+(f.size/1048576).toFixed(1)+' MB)';$('url').value=''}
$('f').onchange=function(e){pick(e.target.files[0])};
$('drop').ondragover=function(e){e.preventDefault()};$('drop').ondrop=function(e){e.preventDefault();pick(e.dataTransfer.files[0])};
async function put(id,i,blob){
  for(var t=0;t<5;t++){
    try{var r=await F('/api/jobs/'+id+'/chunk?i='+i,{method:'POST',body:blob});
      if(r.ok)return;if([401,404,409,413].indexOf(r.status)>=0)throw new Error('Upload session toot gaya, dobara try karo.')}
    catch(e){if(e.message.indexOf('Upload session')===0)throw e}
    await new Promise(function(ok){setTimeout(ok,1500*(t+1))})}
  throw new Error('Network problem: upload fail hua. Wahi file dobara chuno, upload wahin se aage badhega.')}
function poll(id){ls('job',id);$('go').disabled=true;$('res').classList.add('hide');$('run').classList.remove('hide');
  clearInterval(tm);tm=setInterval(function(){F('/api/jobs/'+id).then(function(r){return r.json()}).then(function(s){
    if(s.detail){ls('job',null);return fail(s.detail+' Dobara try karo.')}if(s.status==='error'){ls('job',null);return fail(s.error)}
    if(s.status==='up')return bar('Upload adhoora hai, file dobara chuno',0);bar(s.stage,s.pct);
    if(s.status==='done'){clearInterval(tm);show(s.result)}}).catch(function(){})},1500)}
$('go').onclick=async function(){
  var url=$('url').value.trim();if(!file&&!url)return alert('Pehle video chuno ya link daalo.');
  $('go').disabled=true;$('err').textContent='';$('res').classList.add('hide');$('run').classList.remove('hide');bar('Shuru ho raha hai',0);
  try{
    var id=null,start=0,sv=ls('upl');
    if(file&&sv&&sv.name===file.name&&sv.size===file.size){   // adhoora upload resume
      try{var q=await (await F('/api/jobs/'+sv.id)).json();if(q.status==='up'){id=sv.id;start=q.next}}catch(e){}}
    if(!id){var fd=new FormData();fd.append('lang',document.querySelector('input[name=lang]:checked').value);fd.append('voice',$('voice').value);fd.append('keep',$('keep').checked?'1':'0');
      if(file){fd.append('name',file.name);fd.append('size',file.size)}else fd.append('url',url);
      var r=await F('/api/jobs/init',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw new Error(d.detail||'Error aaya.');
      id=d.id;CH=d.chunk;if(file)ls('upl',{id:id,name:file.name,size:file.size})}
    if(file){var n=Math.ceil(file.size/CH);
      for(var i=start;i<n;i++){await put(id,i,file.slice(i*CH,(i+1)*CH));bar('Upload ho raha hai ('+Math.min(file.size,(i+1)*CH>>20<<20>>20)+' / '+(file.size>>20)+' MB)',Math.round((i+1)/n*100))}
      var s=await F('/api/jobs/'+id+'/start',{method:'POST'});if(!s.ok)throw new Error((await s.json()).detail);ls('upl',null)}
    poll(id);
  }catch(e){fail(e.message)}};
function show(r){$('go').disabled=false;$('res').classList.remove('hide');
  var v=$('v'),au=$('au');v.classList.add('hide');au.classList.add('hide');$('a').classList.add('hide');
  $('a2').href=r.audio+'?dl=1';$('a3').href=r.srt+'?dl=1';
  if(r.video){v.src=r.video;v.classList.remove('hide');$('a').href=r.video+'?dl=1';$('a').classList.remove('hide');$('note').textContent=''}
  else{au.src=r.audio;au.classList.remove('hide');$('note').textContent='Video nahi ban payi (disk/format), dubbed audio ready hai. PC par laga lo: ffmpeg -i original.mp4 -i dubbed.m4a -map 0:v -map 1:a -c copy -shortest dubbed.mp4'}
  $('tr').innerHTML='';r.segments.slice(0,300).forEach(function(g){var p=document.createElement('p'),o=document.createElement('small');
    o.textContent=Math.floor(g.s/60)+':'+String(Math.floor(g.s%60)).padStart(2,'0')+'  '+g.o;p.appendChild(document.createTextNode(g.t));p.appendChild(o);$('tr').appendChild(p)})}
var last=ls('job');if(last)poll(last);   // page refresh ke baad bhi job dikhta rahe
</script></body></html>
